<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Two rack units in the page's style: a controller with a cyan VFD
       reading "LG" on top, a vented unit with status LEDs below. -->
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3e46"/>
      <stop offset=".5" stop-color="#2a2d33"/>
      <stop offset="1" stop-color="#1c1e23"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="#0d0e11"/>
  <!-- rails -->
  <rect x="4" y="6" width="4" height="52" rx="1" fill="#1b1d22"/>
  <rect x="56" y="6" width="4" height="52" rx="1" fill="#1b1d22"/>
  <!-- unit 1: controller -->
  <rect x="6" y="7" width="52" height="28" rx="2.5" fill="url(#metal)"/>
  <rect x="6" y="7" width="52" height="1.5" rx=".75" fill="#ffffff" fill-opacity=".22"/>
  <rect x="11" y="12" width="33" height="18" rx="2" fill="#03181b" stroke="#7ff6ea" stroke-opacity=".25"/>
  <path d="M16.5 15.5v11h6.5M36.5 17.2a5.5 5.5 0 1 0 0 7.6V21h-4" fill="none" stroke="#7ff6ea" stroke-width="2.6" stroke-linecap="square"/>
  <circle cx="51" cy="16" r="2.6" fill="#3ee07f"/>
  <circle cx="51" cy="24" r="2.6" fill="#eba53a"/>
  <!-- unit 2: vented -->
  <rect x="6" y="38" width="52" height="19" rx="2.5" fill="url(#metal)"/>
  <rect x="6" y="38" width="52" height="1.5" rx=".75" fill="#ffffff" fill-opacity=".18"/>
  <g fill="#030304">
    <rect x="11" y="43" width="3" height="9" rx="1"/>
    <rect x="17" y="43" width="3" height="9" rx="1"/>
    <rect x="23" y="43" width="3" height="9" rx="1"/>
    <rect x="29" y="43" width="3" height="9" rx="1"/>
    <rect x="35" y="43" width="3" height="9" rx="1"/>
  </g>
  <circle cx="51" cy="47.5" r="2.6" fill="#3ee07f"/>
</svg>
