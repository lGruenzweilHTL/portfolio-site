mg:
  lead: Ein selbst gehosteter KI-Agent für Home Assistant. Er steuert den 3D-Drucker, sortiert Mails, bereitet den Morgen vor und merkt sich, was wichtig ist. Harmloses passiert einfach, Riskantes wartet auf ein klares Ja.
  role: Autor, seit September 2026
  h1: 'Ein ASP.NET-Harness, durch das jede Anfrage läuft: Agent-Schleife, Tool-Registry, Model-Router, MCP-Client.'
  h2: Eine Risk Engine stuft jeden Tool-Aufruf ein. Sichere Aufrufe laufen, „confirm“ wartet mit eingefrorenen Argumenten, bis ich zustimme, „forbidden“ läuft nie.
  h3: Dauerhafte Hintergrundaufgaben und ein Langzeitgedächtnis mit hybrider Suche auf SQLite und sqlite-vec, dazu eine Web-App in Vue.
  project_page: Projektseite
  docs: Doku
  docs_sr: Dokumentation von Marshal, öffnet in einem neuen Tab
  repo: Repository
  repo_sr: Marshal auf GitHub, öffnet in einem neuen Tab
  shot_alt: Marshal-Dashboard mit offenen Freigaben zum Aufsperren der Haustür und zum Starten eines Drucks, daneben der Live-Status des 3D-Druckers
  note: "Riskantes wartet auf ein klares Ja"

