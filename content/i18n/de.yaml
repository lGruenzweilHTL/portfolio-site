  forkcast_alt: "Forkcast-Wochenkalender für die Essensplanung neben einer Rezeptsuche nach Nudeln"
  forkcast_meta: "Mitwirkender · TypeScript-Backend · Schulprojekt"
  forkcast_desc: "Eine App zur Essensplanung. Rezepte über die Spoonacular-API finden, in einen Kalender ziehen, eine gemeinsame Einkaufsliste bekommen, Rezepte bewerten, Freunde hinzufügen. Den Großteil des Backends habe ich geschrieben."
  roboducks_meta: Robotikclub der HTL Leonding
  roboducks_desc: "Wettbewerbsarbeit für RescueMaze im Robotikclub der Schule. Ich habe ein eigenes serielles Protokoll für die Kommunikation Raspberry Pi → LEGO SPIKE gebaut und einen Labyrinth-Explorer, der in der Simulation den Trémaux-Algorithmus ausführt."
  space_alt: "Space Defenders im Spiel: ein kleines Schiff zwischen leuchtenden feindlichen Schiffen, mit Joystick und Boost-Tasten am Bildschirm"
  space_desc: "Ein Arcade-Spiel fürs Handy: feindliche Raumschiffe zerstören, nicht sterben. Immer stärkere Wellen, gebaut für Touchscreens."
  pigeon_desc: "Man spielt eine Taube im Staatsdienst, die verdeckte Einsätze erledigt. Eine Satire über Überwachungsparanoia und die „Birds Aren't Real“-Ecke des Internets."

