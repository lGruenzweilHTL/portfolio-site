vg:
  model: "Chassis · Hot-Swap"
  status: Aktiv
  view_label: Chassis-Ansicht
  front: Vorne
  rear: Hinten
  lead: "Ein selbst gehosteter Sprachassistent als verteiltes System: Edge-Relays nehmen Sprache auf, ein zentraler Orchestrator steuert die Modell-Pipeline, und eine App am Handy gibt alles Riskante frei."
  role: "Architekt & Hauptentwickler"
  project_page: Projektseite
  org: Organisation auf GitHub
  org_sr: "(vektorgrid-Organisation, öffnet in einem neuen Tab)"
  repo_sr: 'Repository auf GitHub, öffnet in einem neuen Tab'
  modules_label: vektorgrid-Komponenten
  origin_role: Orchestrator
  origin_desc: "Alles läuft über Origin; kein Knoten spricht direkt mit einem anderen. Origin steuert die Pipeline und sammelt jedes Ergebnis ein."
  relay_role: Wake-Word am Edge
  relay_desc: "Erkennt das Wake-Word direkt am Gerät und streamt das Audio an Origin. Die gesprochene Antwort kommt auf demselben Weg zurück."
  gate_role: Biometrische Freigabe
  gate_desc: "Riskante Tool-Aufrufe warten, bis sie per Biometrie am Handy freigegeben werden. Funktioniert auch als eigenständiges Relay."
  scalars_role: Modell-Pipeline
  scalars_desc: "Spracherkennung, Intent-Router, Experten-LLM und Sprachausgabe, von Origin der Reihe nach aufgerufen."
  pull: Ziehen
  rear_cap: "Rückansicht · Verkabelung"
  steps_label: Die Anfrage-Pipeline Schritt für Schritt
  step1: Aufnahme
  step3: Routing
  step4: Inferenz
  step5: Freigabe
  step7: Antwort
  diagram_title: "vektorgrid-Architektur: Relay und Gate sind über den zentralen Orchestrator Origin verbunden, der eine sequenzielle Scalar-Pipeline aus STT, Intent-Router, Experten-LLM und TTS steuert."
  d_audio: Audio
  d_speech: Sprache
  d_approval: Tool-Freigabe
  d_orchestrator: Orchestrator
  d_wake: Wake-Word
  d_biometric: Biometrie
  d_in_sequence: nacheinander
  d_router: Intent-Router
  d_llm: Experten-LLM
  flow_html: >-
    Alles läuft über <b>Origin</b>; kein Knoten spricht direkt mit einem anderen. Ein <b>Relay</b>
    erkennt das Wake-Word und streamt das Audio an Origin, das die <b>Scalar</b>-Pipeline der Reihe
    nach abarbeitet (STT &#8594; Intent-Router &#8594; Experten-LLM &#8594; TTS): Es ruft jeden Worker auf
    und wartet auf sein Ergebnis, bevor der nächste drankommt. Die gesprochene Antwort geht über das
    Relay zurück. Fordert das Modell einen riskanten Tool-Aufruf an, pausiert Origin und lässt ihn von
    <b>Gate</b> per Biometrie freigeben. Gate läuft auch eigenständig: Es fragt Metriken von Origin ab
    und hat ein Relay eingebaut, sodass man auch vom Handy aus mit dem System sprechen kann.

