mg:
  featured: "Hauptprojekt"
  status: "Aktiv"
  view_label: "Chassis-Ansicht"
  front: "Vorne"
  rear: "Hinten"
  lead: "Ein selbst gehosteter KI-Agent für Home Assistant. Er steuert den 3D-Drucker, sortiert Mails, bereitet den Morgen vor und merkt sich, was wichtig ist. Harmloses passiert einfach, Riskantes wartet auf ein klares Ja."
  role: "Autor"
  project_page: "Projektseite"
  repo: "Repo auf GitHub"
  repo_sr: "(Marshal-Repository, öffnet in einem neuen Tab)"
  src_sr: "Quellcode auf GitHub, öffnet in einem neuen Tab"
  modules_label: "Marshal-Komponenten"
  core_role: "Agent-Harness"
  core_desc: "Jede Anfrage, ob gesprochen, getippt oder geplant, läuft durch dieselbe Schleife: Kontext aufbauen, Modell aufrufen, jeden Tool-Aufruf prüfen, ausführen."
  tasks_role: "Hintergrundarbeit"
  tasks_desc: "Dauerhafte Aufgaben, Zeitpläne und Nachfragen. Ergebnisse kommen in dem Raum an, in dem Sie gerade sind, und wecken Sie nachts nicht auf."
  memory_role: "Langzeitgedächtnis"
  memory_desc: "Merkt sich Vorlieben und Projekte und findet den passenden Kontext per hybrider Suche auf SQLite mit sqlite-vec. Alles bleibt sichtbar und bearbeitbar."
  web_role: "Web-App"
  web_desc: "Chat, Freigaben mit einem Tipp, Denkschritte und Tool-Aufrufe live, die Kosten jedes Laufs und der Gedächtnis-Graph. Für Desktop und Handy gebaut."
  rear_cap: "Rückansicht · eine Anfrage"
  steps_label: "Eine Anfrage Schritt für Schritt"
  step1: "Hören"
  step2: "Kontext"
  step3: "Modell"
  step4: "Prüfung"
  step5: "Freigabe"
  step6: "Ausführung"
  step7: "Antwort"
  diagram_title: "Marshal-Architektur: Home Assistant Assist und die Web-App sind mit Core verbunden, dessen Agent-Schleife Kontext, Modell, Risikoprüfung und Tools der Reihe nach durchläuft."
  d_text: "Text"
  d_approval: "Freigabe"
  d_voice: "Sprache"
  d_loop: "Agent-Schleife"
  d_loop_cap: "AGENT-SCHLEIFE"
  d_repeats: "wiederholt sich"
  d_context: "Kontext"
  d_model: "Modell"
  d_guard: "Risikoprüfung"
  d_tools: "Tools"
  flow_html: "Jede Anfrage läuft über <b>Core</b>: Sprache aus <b>Assist</b>, Chat aus der <b>Web-App</b> und geplante Aufgaben. Die Agent-Schleife baut Kontext aus dem Gedächtnis auf, ruft das Modell mit den Tools auf, die in diesem Raum sichtbar sind, und schickt jeden Tool-Aufruf durch die Risikoprüfung, bevor etwas ausgeführt wird. Riskante Aufrufe werden mit ihren genauen Argumenten eingefroren, bis Sie bestätigen, und manches, etwa Mails senden, ist gar kein Tool. Spracherkennung und Sprachausgabe bleiben in Home Assistant: Beim Vorgänger <b>vektorgrid</b> habe ich diese Pipeline samt Protokollen selbst geschrieben, und einmal hat gereicht."

