vk:
  lead: "Der Vorgänger von Marshal: ein selbst gehosteter Sprachassistent als verteiltes System. Ich wollte meinen eigenen Jarvis und einen Grund, vier Programmiersprachen in einem Projekt zu verwenden."
  h1: "Ein Orchestrator in C#, durch den jeder Aufruf läuft, mit Wake-Word-Relays in C++ am Rand des Netzes."
  h2: "Eine Python-Pipeline von Sprache zu Text, über einen Intent-Router und ein Sprachmodell, zurück zu Sprache."
  h3: "Riskante Tool-Aufrufe warteten auf eine biometrische Freigabe in einer Kotlin-App auf meinem Handy."
  learned_title: "Was ich gelernt habe"
  learned: "Sprach-Pipeline und Satelliten-Protokoll nicht selbst schreiben. Sie haben die meiste Zeit gekostet und waren nicht der spannende Teil. Marshal überlässt die Sprache Home Assistant Assist und steckt die Arbeit in den Agenten."

