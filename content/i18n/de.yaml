about:
  title: Über mich
  p1: Ich bin Lukas, Schüler an der HTL Leonding. Die meiste Zeit stecke ich in Servercode und Spiele, und ab und zu in einen Raspberry Pi, der für einen Wettbewerb auf einen LEGO-Roboter geschraubt ist.
  p2_html: Die meisten meiner Projekte sind entstanden, weil mich etwas genervt hat. <strong>SceneForge AI</strong> habe ich gebaut, weil es mühsam ist, Szenen von Hand aufzubauen, und ein serielles Protokoll für den Robotik-Club, weil es keinen sauberen Weg gab, einen LEGO SPIKE von einem Raspberry Pi aus zu steuern.
  p3: 'Abseits der Tastatur: Tischtennis, Motorräder und mehr Trackmania, als ich zugeben möchte.'
  homelab: Homelab
  homelab_desc: Vier Proxmox-Nodes (ausrangierte Desktop-PCs) mit Immich, Gitea, Vaultwarden, Jellyfin samt *arr-Stack, einem Minecraft-Server, Pi-hole und dieser Website. Meine Familie verlässt sich darauf, also gibt es Backups und replizierten Speicher.
  ender: Ender of Theseus
  ender_desc_html: 'Ein Ender 3 Pro. Er ist so weit umgebaut, dass ich ihn nach dem <a href="https://de.wikipedia.org/wiki/Schiff_des_Theseus" target="_blank" rel="noopener">Schiff des Theseus<span class="sr-only"> (Wikipedia, öffnet in einem neuen Tab)</span></a> benannt habe. Als Nächstes: ein Gehäuse für das Board, Fernabschaltung und eine zweite Z-Spindel.'
  moto: Motorräder
  moto_desc: Derzeit eine Aprilia Tuono 125, mit Plänen für etwas Größeres.
  sketch_alt: "Kreideskizze meines 3D-Druckers Ender 3 Pro"
  next: "als Nächstes:"
  n_z: "eine zweite Z-Spindel"
  n_power: "Fernabschaltung"
  n_board: "ein Gehäuse für das Board"

