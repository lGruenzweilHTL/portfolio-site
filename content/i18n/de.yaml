head:
  title: "Lukas Grünzweil · Backend- & KI-Entwickler, Schüler an der HTL Leonding"
  description: "Lukas Grünzweil, Schüler an der HTL Leonding in Österreich, entwickelt Backend-Systeme, KI-Tools und Unity-Spiele in C#, Python und TypeScript. Aktuell im 4. von 5 Jahren, Abschluss im Juni 2028, offen für ein Backend-Praktikum."
  og_title: "Lukas Grünzweil · Backend- & KI-Entwickler"
  og_description: "Schüler an der HTL Leonding, Österreich (4. von 5 Jahren). Backend-Systeme, KI-Tools und Spiele in C#, Python und TypeScript. Offen für ein Backend-Praktikum."
  og_image_alt: "Lukas Grünzweil: Backend-Systeme, KI-Tools und Spiele"

ld:
  job_title: Schüler
  person_description: "Schüler an der HTL Leonding in Österreich, der Backend-Systeme, KI-Tools und Spiele entwickelt, vor allem in C#, Unity und Python. Aktuell im 4. von 5 Jahren, Abschluss im Juni 2028, offen für ein Backend-Praktikum."
  seeks_name: "Backend-Praktikum"
  seeks_description: "Offen für ein Backend-Praktikum; aktuell im 4. von 5 Jahren an der HTL Leonding, Abschluss im Juni 2028."
  projects_name: "Projekte von Lukas Grünzweil"
  vektorgrid: "Der Vorgänger von Marshal: ein selbst gehosteter Sprachassistent als verteiltes System, mit C++-Edge-Relays, einem C#-Orchestrator, der eine Python-Pipeline aus Spracherkennung, Intent-Routing, LLM und Sprachausgabe steuert, und einer Kotlin-App, die riskante Tool-Aufrufe per Biometrie freigibt."
  marshal: "Ein selbst gehosteter KI-Agent für Home Assistant: Ein ASP.NET-Harness prüft jeden Tool-Aufruf nach Risiko, führt Hintergrundaufgaben aus und hat ein Langzeitgedächtnis, dazu eine Vue-Web-App."
  sceneforge: "Ein KI-Plugin für den Unity Editor, das aus einer Szenenbeschreibung in Klartext GameObjects und Komponenten erzeugt."
  uniconsole: "Eine kostenlose, schlanke In-Game-Debug-Konsole für Unity: statische Methode mit [Command] markieren und über ein Terminal in der Szene aufrufen."
  forkcast: "Ein Schulprojekt zur Essensplanung mit Rezeptsuche über die Spoonacular-API, Essenskalender und zusammengeführten Einkaufslisten. Lukas hat den Großteil des TypeScript-Backends geschrieben."
  space_defenders: "Ein Arcade-Spiel für Mobilgeräte, gebaut in Unity, mit immer stärkeren Wellen feindlicher Raumschiffe und Touch-Steuerung."
  pigeon: "Ein satirisches Unity-Spiel in Arbeit über eine Taube, die verdeckte Einsätze für die Regierung erledigt."
  roboducks: "Arbeit für den RescueMaze-Robotikwettbewerb im Robotikclub der HTL Leonding: ein serielles Protokoll zwischen Raspberry Pi und LEGO-SPIKE-Hub sowie ein Labyrinth-Explorer mit dem Trémaux-Algorithmus."

