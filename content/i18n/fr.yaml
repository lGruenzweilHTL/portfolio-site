vk:
  lead: "Le prédécesseur de Marshal : un assistant vocal auto-hébergé, construit comme un système distribué. Je voulais mon propre Jarvis, et une raison d'utiliser quatre langages de programmation dans un seul projet."
  h1: "Un orchestrateur en C# par lequel passe chaque appel, avec des relais de mot d'activation en C++ en périphérie."
  h2: "Un pipeline Python de la voix au texte, via un routeur d'intentions et un modèle de langage, puis retour à la voix."
  h3: "Les appels d'outils risqués attendaient une validation biométrique dans une application Kotlin sur mon téléphone."
  learned_title: "Ce que j'en ai appris"
  learned: "Ne pas écrire à la main le pipeline vocal et le protocole des satellites. Ils ont pris l'essentiel du temps et n'étaient pas la partie intéressante. Marshal confie la voix à Home Assistant Assist et met l'effort dans l'agent."

