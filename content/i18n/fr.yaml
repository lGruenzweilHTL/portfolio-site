head:
  title: Lukas Grünzweil · Développeur backend, élève à la HTL Leonding
  description: "Lukas Grünzweil, élève à la HTL Leonding en Autriche, développe des systèmes backend, des outils d'IA et des jeux Unity en C#, Python et TypeScript. Actuellement en 4e année sur 5, diplômé en juin 2028, ouvert à un stage backend."
