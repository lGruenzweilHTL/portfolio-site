vg:
  model: "Châssis · hot-swap"
  status: Actif
  view_label: Vue du châssis
  front: Avant
  rear: Arrière
  lead: "Un assistant vocal auto-hébergé, conçu comme un système distribué : des relais edge captent la parole, un orchestrateur central pilote la chaîne de modèles, et une application mobile valide tout ce qui est risqué."
  role: "Architecte et développeur principal"
  project_page: Page du projet
  org: Organisation sur GitHub
  org_sr: "(organisation vektorgrid, s'ouvre dans un nouvel onglet)"
  repo_sr: 'dépôt sur GitHub, s''ouvre dans un nouvel onglet'
  modules_label: Composants de vektorgrid
  origin_role: Orchestrateur
  origin_desc: "Tout passe par Origin ; aucun nœud ne parle directement à un autre. Il pilote la chaîne et collecte chaque résultat."
  relay_role: Mot d'éveil en edge
  relay_desc: "Détecte le mot d'éveil en périphérie et envoie l'audio en continu à Origin. La réponse parlée revient par le même chemin."
  gate_role: Validation biométrique
  gate_desc: "Les appels d'outils risqués attendent d'être validés par biométrie sur le téléphone. Fonctionne aussi comme relais autonome."
  scalars_role: Chaîne de modèles
  scalars_desc: "Reconnaissance vocale, routeur d'intention, LLM expert et synthèse vocale, appelés dans l'ordre par Origin."
  pull: Tirer
  rear_cap: "Vue arrière · câblage"
  steps_label: Parcourir la chaîne de traitement étape par étape
  step1: Capture
  step3: Routage
  step4: Inférence
  step5: Validation
  step7: Réponse
  diagram_title: "Architecture de vektorgrid : Relay et Gate sont reliés par l'orchestrateur central Origin, qui pilote une chaîne séquentielle de Scalars : STT, routeur d'intention, LLM expert et TTS."
  d_audio: audio
  d_speech: parole
  d_approval: validation d'outil
  d_orchestrator: orchestrateur
  d_wake: mot d'éveil
  d_biometric: biométrie
  d_in_sequence: dans l'ordre
  d_router: Routeur d'intention
  d_llm: LLM expert
  flow_html: >-
    Tout passe par <b>Origin</b> ; aucun nœud ne parle directement à un autre. Un <b>Relay</b>
    détecte le mot d'éveil et envoie l'audio à Origin, qui exécute la chaîne <b>Scalar</b> dans
    l'ordre (STT &#8594; routeur d'intention &#8594; LLM expert &#8594; TTS), en appelant chaque worker et
    en récupérant son résultat avant de passer au suivant. La réponse parlée revient par le Relay.
    Si le modèle demande un appel d'outil risqué, Origin se met en pause et demande à <b>Gate</b> de
    le valider par biométrie. Gate fonctionne aussi seul : il interroge Origin pour ses métriques et
    intègre un Relay, ce qui permet de parler au système depuis son téléphone.

