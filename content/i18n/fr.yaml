mg:
  lead: Un agent IA auto-hébergé pour Home Assistant. Il pilote l'imprimante 3D, trie les mails, prépare la matinée et retient ce qui compte. Les actions anodines se font seules ; les risquées attendent un oui clair.
  role: Auteur, depuis septembre 2026
  h1: 'Un harness ASP.NET par lequel passe chaque requête : boucle d''agent, registre d''outils, routeur de modèles, client MCP.'
  h2: Un moteur de risque classe chaque appel d'outil. Les appels sûrs s'exécutent, « confirm » attend avec ses arguments figés jusqu'à mon accord, « forbidden » ne s'exécute jamais.
  h3: Des tâches de fond durables et une mémoire à long terme avec recherche hybride sur SQLite et sqlite-vec, avec une application web Vue par-dessus.
  project_page: Page du projet
  docs: Documentation
  docs_sr: documentation de Marshal, s'ouvre dans un nouvel onglet
  repo: Dépôt
  repo_sr: Marshal sur GitHub, s'ouvre dans un nouvel onglet
  shot_alt: Tableau de bord de Marshal avec des validations en attente pour déverrouiller la porte d'entrée et lancer une impression, à côté de l'état en direct de l'imprimante 3D
  note: "les risquées attendent un oui clair"

gate:
  title: "Le filtre de risque."
  caption_html: "Chaque appel d'outil reçoit un niveau de risque. Les appels sûrs s'exécutent aussitôt. Les appels à confirmer, par exemple <code>printer.start_print</code>, sont retenus avec leurs arguments exacts figés pendant 60&nbsp;s au plus, jusqu'à mon accord. Les appels interdits ne s'exécutent jamais."
  aria: "Schéma : un appel d'outil reçoit un niveau de risque. Les appels sûrs s'exécutent aussitôt ; les appels à confirmer sont retenus avec leurs arguments figés pendant 60 secondes au plus, jusqu'à mon accord ; les appels interdits ne s'exécutent jamais."
