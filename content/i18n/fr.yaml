ld:
  job_title: Élève ingénieur
  person_description: "Élève à la HTL Leonding en Autriche qui développe des systèmes backend, des outils d'IA et des jeux, principalement en C#, Unity et Python. Actuellement en 4e année sur 5, diplômé en juin 2028, ouvert à un stage backend."
  seeks_name: "Stage backend"
  seeks_description: "Ouvert à un stage backend ; actuellement en 4e année sur 5 à la HTL Leonding, diplômé en juin 2028."
  projects_name: "Projets de Lukas Grünzweil"
  vektorgrid: "Le prédécesseur de Marshal : un assistant vocal auto-hébergé conçu comme un système distribué, avec des relais edge en C++, un orchestrateur C# qui pilote une chaîne Python de reconnaissance vocale, routage d'intention, LLM et synthèse vocale, et une application Kotlin qui valide les appels d'outils risqués par biométrie."
  marshal: "Un agent IA auto-hébergé pour Home Assistant : un noyau ASP.NET évalue le risque de chaque appel d'outil, exécute des tâches en arrière-plan et garde une mémoire à long terme, avec une application web Vue."
  sceneforge: "Un plugin d'IA pour l'éditeur Unity qui transforme une description de scène en texte libre en GameObjects et composants."
  uniconsole: "Une console de débogage en jeu, gratuite et légère, pour Unity : annotez une méthode statique avec [Command] et appelez-la depuis un terminal dans la scène."
  forkcast: "Un projet scolaire de planification des repas avec recherche de recettes via l'API Spoonacular, un calendrier des repas et des listes de courses combinées. Lukas a écrit l'essentiel du backend TypeScript."
  space_defenders: "Un jeu d'arcade mobile réalisé avec Unity, avec des vagues de vaisseaux ennemis toujours plus fortes et des commandes tactiles."
  pigeon: "Un jeu Unity satirique en cours de développement sur un pigeon qui mène des opérations secrètes pour le gouvernement."
  roboducks: "Travaux pour la compétition de robotique RescueMaze au club de robotique de la HTL Leonding : un protocole série entre un Raspberry Pi et un hub LEGO SPIKE, et un contrôleur d'exploration de labyrinthe basé sur l'algorithme de Trémaux."

