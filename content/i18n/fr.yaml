  forkcast_alt: "Calendrier hebdomadaire de repas Forkcast à côté d'une recherche de recettes de nouilles"
  forkcast_meta: "Contributeur · backend TypeScript · projet scolaire"
  forkcast_desc: "Une application de planification des repas. Trouvez des recettes via l'API Spoonacular, placez-les dans un calendrier, obtenez une liste d'ingrédients combinée, notez des recettes, ajoutez des amis. J'ai écrit l'essentiel du backend."
  roboducks_meta: Club de robotique de la HTL Leonding
  roboducks_desc: "Travaux pour la compétition RescueMaze au club de robotique du lycée. J'ai créé un protocole série sur mesure pour la communication Raspberry Pi → LEGO SPIKE, et un contrôleur d'exploration de labyrinthe utilisant l'algorithme de Trémaux en simulation."
  space_alt: "Partie de Space Defenders : un petit vaisseau parmi des vaisseaux ennemis lumineux, avec joystick et bouton de boost à l'écran"
  space_desc: "Un jeu d'arcade mobile : détruire les vaisseaux ennemis, ne pas mourir. Des vagues toujours plus fortes, pensé pour les écrans tactiles."
  pigeon_desc: "Vous incarnez un pigeon payé par le gouvernement pour mener des opérations secrètes. Une satire de la paranoïa de la surveillance et du coin d'Internet « Birds Aren't Real »."

