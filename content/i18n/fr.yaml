about:
  title: À propos
  p1: Je suis Lukas, élève à la HTL Leonding. Je passe l'essentiel de mon temps sur du code serveur et des jeux, et de temps en temps sur un Raspberry Pi vissé sur un robot LEGO pour une compétition.
  p2_html: La plupart de mes projets sont nés d'un agacement. J'ai créé <strong>SceneForge AI</strong> parce que monter des scènes à la main est fastidieux, et le protocole série derrière <strong>RoboDucks</strong> parce qu'il n'existait pas de moyen propre de piloter un LEGO SPIKE depuis un Raspberry Pi.
  p3: 'Loin du clavier : tennis de table, motos, et plus de Trackmania que je ne voudrais l''admettre.'
  homelab: Homelab
  homelab_desc: Quatre nœuds Proxmox (des ordinateurs de bureau recyclés) qui hébergent Immich, Gitea, Vaultwarden, Jellyfin avec la stack *arr, un serveur Minecraft, Pi-hole et ce site. Ma famille en dépend, il a donc des sauvegardes et un stockage répliqué.
  ender: Ender of Theseus
  ender_desc_html: 'Une Ender 3 Pro. Elle a été tellement modifiée que je l''ai nommée d''après le <a href="https://fr.wikipedia.org/wiki/Bateau_de_Th%C3%A9s%C3%A9e" target="_blank" rel="noopener">bateau de Thésée<span class="sr-only"> (Wikipédia, s''ouvre dans un nouvel onglet)</span></a>. Prochaines étapes : un boîtier pour la carte, une alimentation à distance et une double vis Z.'
  moto: Motos
  moto_desc: Actuellement une Aprilia Tuono 125, avec l'idée de passer à plus gros.
  sketch_alt: "Croquis à la craie de mon imprimante 3D Ender 3 Pro"
  next: "prochaines étapes :"
  n_z: "une double vis Z"
  n_power: "une alimentation à distance"
  n_board: "un boîtier pour la carte"

