mg:
  lead: Un agente IA self-hosted per Home Assistant. Gestisce la stampante 3D, smista la posta, prepara la mattina e ricorda ciò che conta. Le azioni innocue avvengono e basta; quelle rischiose aspettano un sì chiaro.
  role: Autore, da settembre 2026
  h1: 'Un harness ASP.NET da cui passa ogni richiesta: ciclo dell''agente, registro degli strumenti, router dei modelli, client MCP.'
  h2: Un motore di rischio classifica ogni chiamata a uno strumento. Le chiamate sicure partono, «confirm» attende con gli argomenti congelati finché non approvo, «forbidden» non parte mai.
  h3: Attività in background persistenti e una memoria a lungo termine con ricerca ibrida su SQLite e sqlite-vec, con sopra un'app web in Vue.
  project_page: Pagina del progetto
  docs: Documentazione
  docs_sr: documentazione di Marshal, si apre in una nuova scheda
  repo: Repository
  repo_sr: Marshal su GitHub, si apre in una nuova scheda
  shot_alt: Dashboard di Marshal con approvazioni in sospeso per sbloccare la porta d'ingresso e avviare una stampa, accanto allo stato live della stampante 3D
  note: "quelle rischiose aspettano un sì chiaro"

gate:
  title: "Il filtro del rischio."
  caption_html: "Ogni chiamata a uno strumento riceve un livello di rischio. Le chiamate sicure partono subito. Quelle da confermare, per esempio <code>printer.start_print</code>, restano in attesa con gli argomenti esatti congelati per un massimo di 60&nbsp;s, finché non dico sì. Quelle vietate non partono mai."
  aria: "Diagramma: una chiamata a uno strumento riceve un livello di rischio. Quelle sicure partono subito; quelle da confermare restano in attesa con gli argomenti congelati per un massimo di 60 secondi, finché non dico sì; quelle vietate non partono mai."
