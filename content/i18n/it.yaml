ld:
  job_title: Studente
  person_description: "Studente alla HTL Leonding in Austria che sviluppa sistemi backend, strumenti di IA e giochi, soprattutto in C#, Unity e Python. Attualmente è al 4° anno su 5, si diploma a giugno 2028 ed è disponibile per un tirocinio backend."
