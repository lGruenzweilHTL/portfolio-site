vk:
  lead: "Il predecessore di Marshal: un assistente vocale self-hosted costruito come sistema distribuito. Volevo il mio Jarvis, e un motivo per usare quattro linguaggi di programmazione in un solo progetto."
  h1: "Un orchestratore in C# da cui passa ogni chiamata, con relay per la parola di attivazione in C++ ai margini della rete."
  h2: "Una pipeline Python dalla voce al testo, attraverso un router di intenti e un modello linguistico, e di nuovo alla voce."
  h3: "Le chiamate a strumenti rischiose attendevano un'approvazione biometrica in un'app Kotlin sul mio telefono."
  learned_title: "Cosa ho imparato"
  learned: "Non scrivere a mano la pipeline vocale e il protocollo dei satelliti. Hanno richiesto quasi tutto il tempo e non erano la parte interessante. Marshal lascia la voce a Home Assistant Assist e concentra lo sforzo sull'agente."

