vg:
  model: "Chassis · hot-swap"
  status: Attivo
  view_label: Vista dello chassis
  front: Fronte
  rear: Retro
  lead: "Un assistente vocale self-hosted, costruito come sistema distribuito: i relay edge catturano la voce, un orchestratore centrale gestisce la pipeline dei modelli e un'app sul telefono approva tutto ciò che è rischioso."
  role: "Architetto e sviluppatore principale"
  project_page: Pagina del progetto
  org: Organizzazione su GitHub
  org_sr: "(organizzazione vektorgrid, si apre in una nuova scheda)"
  repo_sr: 'repository su GitHub, si apre in una nuova scheda'
  modules_label: Componenti di vektorgrid
  origin_role: Orchestratore
  origin_desc: "Tutto passa per Origin; nessun nodo parla direttamente con un altro. Guida la pipeline e raccoglie ogni risultato."
  relay_role: Wake word sull'edge
  relay_desc: "Rileva la wake word sul dispositivo e trasmette l'audio a Origin. La risposta vocale torna per la stessa strada."
  gate_role: Approvazione biometrica
  gate_desc: "Le chiamate a strumenti rischiose restano in attesa finché non vengono approvate con la biometria sul telefono. Funziona anche come relay autonomo."
  scalars_role: Pipeline dei modelli
  scalars_desc: "Riconoscimento vocale, router degli intenti, LLM esperto e sintesi vocale, chiamati in sequenza da Origin."
  pull: Estrai
  rear_cap: "Vista posteriore · cablaggio"
  steps_label: Segui la pipeline della richiesta passo per passo
  step1: Acquisizione
  step3: Instradamento
  step4: Inferenza
  step5: Approvazione
  step7: Risposta
  diagram_title: "Architettura di vektorgrid: Relay e Gate sono collegati tramite l'orchestratore centrale Origin, che guida una pipeline sequenziale di Scalar: STT, router degli intenti, LLM esperto e TTS."
  d_audio: audio
  d_speech: voce
  d_approval: approvazione
  d_orchestrator: orchestratore
  d_wake: wake word
  d_biometric: biometria
  d_in_sequence: in sequenza
  d_router: Router intenti
  d_llm: LLM esperto
  flow_html: >-
    Tutto passa per <b>Origin</b>; nessun nodo parla direttamente con un altro. Un <b>Relay</b>
    rileva la wake word e trasmette l'audio a Origin, che esegue la pipeline <b>Scalar</b> in ordine
    (STT &#8594; router degli intenti &#8594; LLM esperto &#8594; TTS), chiamando ogni worker e raccogliendone
    il risultato prima del successivo. La risposta vocale torna attraverso il Relay. Se il modello
    richiede una chiamata a uno strumento rischiosa, Origin si ferma e chiede a <b>Gate</b> di
    approvarla con la biometria. Gate funziona anche da solo: interroga Origin per le metriche e ha un
    Relay integrato, così si può parlare con il sistema dal telefono.

