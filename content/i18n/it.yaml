  tier: "livello di rischio"
  every: "ogni chiamata ne riceve uno"
  safe: "sicura"
  now: "parte subito"
  confirm: "da confermare"
  example: "es. printer.start_print"
  held: "in attesa"
  frozen: "argomenti congelati"
  ttl: "fino a 60 s"
  say_yes: "dico sì"
  runs: "parte"
  forbidden: "vietata"
  never: "non parte mai"

