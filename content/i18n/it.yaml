  projects_name: "Progetti di Lukas Grünzweil"
  vektorgrid: "Il predecessore di Marshal: un assistente vocale self-hosted costruito come sistema distribuito, con relay edge in C++, un orchestratore C# che gestisce una pipeline Python di riconoscimento vocale, instradamento degli intenti, LLM e sintesi vocale, e un'app Kotlin che approva con la biometria le chiamate a strumenti rischiose."
  marshal: "Un agente IA self-hosted per Home Assistant: un nucleo ASP.NET valuta il rischio di ogni chiamata a strumenti, esegue attività in background e mantiene una memoria a lungo termine, con una web app in Vue."
  sceneforge: "Un plugin di IA per l'editor di Unity che trasforma la descrizione testuale di una scena in GameObject e componenti."
  uniconsole: "Una console di debug in-game per Unity, gratuita e leggera: marca un metodo statico con [Command] e richiamalo da un terminale nella scena."
  forkcast: "Un progetto scolastico per pianificare i pasti con ricerca di ricette tramite l'API Spoonacular, un calendario dei pasti e liste della spesa combinate. Lukas ha scritto gran parte del backend in TypeScript."
  space_defenders: "Un gioco arcade per dispositivi mobili realizzato in Unity, con ondate crescenti di astronavi nemiche e comandi touch."
  pigeon: "Un gioco satirico in Unity in lavorazione su un piccione che conduce operazioni segrete per il governo."
  roboducks: "Lavoro per la competizione di robotica RescueMaze nel club di robotica della HTL Leonding: un protocollo seriale tra un Raspberry Pi e un hub LEGO SPIKE e un controller per esplorare labirinti con l'algoritmo di Trémaux."

