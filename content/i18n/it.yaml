  description: "Lukas Grünzweil, studente alla HTL Leonding in Austria, sviluppa sistemi backend, strumenti di IA e giochi Unity in C#, Python e TypeScript. Attualmente è al 4° anno su 5, si diploma a giugno 2028 ed è disponibile per un tirocinio backend."
