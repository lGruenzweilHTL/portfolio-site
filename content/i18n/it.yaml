about:
  title: Chi sono
  p1: Sono Lukas, studente alla HTL Leonding. Passo la maggior parte del tempo tra codice server e giochi e, ogni tanto, su un Raspberry Pi avvitato a un robot LEGO per una competizione.
  p2_html: La maggior parte dei miei progetti è nata perché qualcosa mi dava fastidio. Ho creato <strong>SceneForge AI</strong> perché allestire le scene a mano è noioso, e un protocollo seriale per il club di robotica perché non c'era un modo pulito per comandare un LEGO SPIKE da un Raspberry Pi.
  p3: 'Lontano dalla tastiera: ping pong, moto e più Trackmania di quanto vorrei ammettere.'
  homelab: Homelab
  homelab_desc: Quattro nodi Proxmox (PC desktop riutilizzati) che ospitano Immich, Gitea, Vaultwarden, Jellyfin con lo stack *arr, un server Minecraft, Pi-hole e questo sito. La mia famiglia ci conta, quindi ha backup e storage replicato.
  ender: Ender of Theseus
  ender_desc_html: 'Una Ender 3 Pro. L''ho modificata così tanto che le ho dato il nome della <a href="https://it.wikipedia.org/wiki/Paradosso_della_nave_di_Teseo" target="_blank" rel="noopener">nave di Teseo<span class="sr-only"> (Wikipedia, si apre in una nuova scheda)</span></a>. Prossimi passi: un case per la scheda, l''accensione da remoto e una doppia vite Z.'
  moto: Moto
  moto_desc: Al momento un'Aprilia Tuono 125, con l'idea di passare a qualcosa di più grande.
  sketch_alt: "Schizzo a gesso della mia stampante 3D Ender 3 Pro"
  next: "prossimi passi:"
  n_z: "una doppia vite Z"
  n_power: "l'accensione da remoto"
  n_board: "un case per la scheda"

