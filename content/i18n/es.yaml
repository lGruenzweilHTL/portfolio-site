vk:
  lead: "El predecesor de Marshal: un asistente de voz autoalojado construido como sistema distribuido. Quería mi propio Jarvis y una excusa para usar cuatro lenguajes de programación en un solo proyecto."
  h1: "Un orquestador en C# por el que pasa cada llamada, con relés de palabra de activación en C++ en el borde."
  h2: "Un pipeline en Python de voz a texto, pasando por un enrutador de intenciones y un modelo de lenguaje, y de vuelta a voz."
  h3: "Las llamadas a herramientas arriesgadas esperaban una aprobación biométrica en una app Kotlin de mi móvil."
  learned_title: "Lo que aprendí"
  learned: "No escribir a mano el pipeline de voz ni el protocolo de los satélites. Se llevaron la mayor parte del tiempo y no eran la parte interesante. Marshal deja la voz a Home Assistant Assist y pone el esfuerzo en el agente."

