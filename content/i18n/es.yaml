  description: "Lukas Grünzweil, estudiante de la HTL Leonding en Austria, desarrolla sistemas backend, herramientas de IA y juegos en Unity con C#, Python y TypeScript. Actualmente está en 4.º de 5, se gradúa en junio de 2028 y busca prácticas de backend."
