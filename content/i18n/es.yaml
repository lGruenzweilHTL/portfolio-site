mg:
  lead: Un agente de IA autoalojado para Home Assistant. Controla la impresora 3D, ordena el correo, prepara la mañana y recuerda lo importante. Lo inofensivo ocurre sin más; lo arriesgado espera un sí claro.
  role: Autor, desde septiembre de 2026
  h1: 'Un harness de ASP.NET por el que pasa cada petición: bucle del agente, registro de herramientas, enrutador de modelos, cliente MCP.'
  h2: Un motor de riesgo clasifica cada llamada a una herramienta. Las seguras se ejecutan, «confirm» espera con sus argumentos congelados hasta que yo apruebe, «forbidden» nunca se ejecuta.
  h3: Tareas en segundo plano duraderas y una memoria a largo plazo con búsqueda híbrida sobre SQLite y sqlite-vec, con una aplicación web en Vue encima.
  project_page: Página del proyecto
  docs: Documentación
  docs_sr: documentación de Marshal, se abre en una pestaña nueva
  repo: Repositorio
  repo_sr: Marshal en GitHub, se abre en una pestaña nueva
  shot_alt: Panel de Marshal con aprobaciones pendientes para abrir la puerta principal e iniciar una impresión, junto al estado en vivo de la impresora 3D
  note: "lo arriesgado espera un sí claro"

gate:
  title: "La barrera de riesgo."
  caption_html: "Cada llamada a una herramienta recibe un nivel de riesgo. Las seguras se ejecutan al instante. Las que requieren confirmación, por ejemplo <code>printer.start_print</code>, quedan retenidas con sus argumentos exactos congelados hasta 60&nbsp;s, hasta que yo diga que sí. Las prohibidas nunca se ejecutan."
  aria: "Diagrama: una llamada a una herramienta recibe un nivel de riesgo. Las seguras se ejecutan al instante; las que requieren confirmación quedan retenidas con sus argumentos congelados hasta 60 segundos, hasta que yo diga que sí; las prohibidas nunca se ejecutan."
