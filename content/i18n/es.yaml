  lead: "Un asistente de voz autoalojado, construido como sistema distribuido: los relés edge capturan la voz, un orquestador central ejecuta la cadena de modelos y una app en el móvil aprueba todo lo que sea arriesgado."
  role: "Arquitecto y desarrollador principal"
  project_page: Página del proyecto
  org: Organización en GitHub
  org_sr: "(organización vektorgrid, se abre en una pestaña nueva)"
  repo_sr: 'repositorio en GitHub, se abre en una pestaña nueva'
  modules_label: Componentes de vektorgrid
  origin_role: Orquestador
  origin_desc: "Todo pasa por Origin; ningún nodo habla directamente con otro. Dirige la cadena y recoge cada resultado."
  relay_role: Palabra de activación en el edge
  relay_desc: "Detecta la palabra de activación en el dispositivo y envía el audio a Origin. La respuesta hablada vuelve por el mismo camino."
  gate_role: Aprobación biométrica
  gate_desc: "Las llamadas a herramientas arriesgadas esperan hasta aprobarse con biometría en el móvil. También funciona como relé independiente."
  scalars_role: Cadena de modelos
  scalars_desc: "Reconocimiento de voz, enrutador de intenciones, LLM experto y síntesis de voz, llamados en orden por Origin."
  pull: Tirar
  rear_cap: "Vista trasera · cableado"
  steps_label: Recorrer la cadena de la petición paso a paso
  step1: Captura
  step3: Enrutado
  step4: Inferencia
  step5: Aprobación
  step7: Respuesta
  diagram_title: "Arquitectura de vektorgrid: Relay y Gate se conectan a través del orquestador central Origin, que dirige una cadena secuencial de Scalars: STT, enrutador de intenciones, LLM experto y TTS."
  d_audio: audio
  d_speech: voz
  d_approval: aprobación
  d_orchestrator: orquestador
  d_wake: activación
  d_biometric: biometría
  d_in_sequence: en orden
  d_router: Enrutador
  d_llm: LLM experto
  flow_html: >-
    Todo pasa por <b>Origin</b>; ningún nodo habla directamente con otro. Un <b>Relay</b>
    detecta la palabra de activación y envía el audio a Origin, que ejecuta la cadena <b>Scalar</b>
    en orden (STT &#8594; enrutador de intenciones &#8594; LLM experto &#8594; TTS), llamando a cada worker
    y recogiendo su resultado antes del siguiente. La respuesta hablada vuelve por el Relay. Si el
    modelo pide una llamada a una herramienta arriesgada, Origin se detiene y pide a <b>Gate</b> que
    la apruebe con biometría. Gate también funciona por su cuenta: consulta métricas a Origin y lleva
    un Relay integrado, así que se puede hablar con el sistema desde el móvil.

