about:
  title: Sobre mí
  p1: Soy Lukas, estudiante de la HTL Leonding. Paso la mayor parte del tiempo con código de servidor y juegos y, de vez en cuando, con una Raspberry Pi atornillada a un robot de LEGO para una competición.
  p2_html: La mayoría de mis proyectos nacieron porque algo me molestaba. Creé <strong>SceneForge AI</strong> porque montar escenas a mano es tedioso, y el protocolo serie detrás de <strong>RoboDucks</strong> porque no había una forma limpia de controlar un LEGO SPIKE desde una Raspberry Pi.
  p3: 'Lejos del teclado: tenis de mesa, motos y más Trackmania del que me gustaría admitir.'
  homelab: Homelab
  homelab_desc: Cuatro nodos Proxmox (ordenadores de sobremesa reaprovechados) con Immich, Gitea, Vaultwarden, Jellyfin con el stack *arr, un servidor de Minecraft, Pi-hole y este sitio. Mi familia depende de él, así que tiene copias de seguridad y almacenamiento replicado.
  ender: Ender of Theseus
  ender_desc_html: 'Una Ender 3 Pro. La he modificado tanto que le puse el nombre del <a href="https://es.wikipedia.org/wiki/Barco_de_Teseo" target="_blank" rel="noopener">barco de Teseo<span class="sr-only"> (Wikipedia, se abre en una pestaña nueva)</span></a>. Lo siguiente de la lista: una caja para la placa, encendido remoto y un doble husillo Z.'
  moto: Motos
  moto_desc: Ahora mismo una Aprilia Tuono 125, con planes de pasar a algo más grande.
  sketch_alt: "Boceto con tiza de mi impresora 3D Ender 3 Pro"
  next: "lo siguiente de la lista:"
  n_z: "un doble husillo Z"
  n_power: "encendido remoto"
  n_board: "una caja para la placa"

