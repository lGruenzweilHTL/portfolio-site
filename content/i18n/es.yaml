  tier: "nivel de riesgo"
  every: "cada llamada recibe uno"
  safe: "segura"
  now: "se ejecuta ya"
  confirm: "confirmar"
  example: "p. ej. printer.start_print"
  held: "retenida"
  frozen: "argumentos congelados"
  ttl: "hasta 60 s"
  say_yes: "digo que sí"
  runs: "se ejecuta"
  forbidden: "prohibida"
  never: "nunca se ejecuta"

