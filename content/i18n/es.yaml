ld:
  job_title: Estudiante
  person_description: "Estudiante de la HTL Leonding en Austria que desarrolla sistemas backend, herramientas de IA y juegos, sobre todo en C#, Unity y Python. Actualmente está en 4.º de 5, se gradúa en junio de 2028 y está abierto a prácticas de backend."
  seeks_name: "Prácticas de backend"
  seeks_description: "Abierto a prácticas de backend; actualmente en 4.º de 5 en la HTL Leonding y se gradúa en junio de 2028."
  projects_name: "Proyectos de Lukas Grünzweil"
  vektorgrid: "El predecesor de Marshal: un asistente de voz autoalojado construido como sistema distribuido, con relés edge en C++, un orquestador en C# que ejecuta una cadena en Python de reconocimiento de voz, enrutado de intenciones, LLM y síntesis de voz, y una app en Kotlin que aprueba con biometría las llamadas a herramientas arriesgadas."
  marshal: "Un agente de IA autoalojado para Home Assistant: un núcleo en ASP.NET evalúa el riesgo de cada llamada a herramientas, ejecuta tareas en segundo plano y mantiene una memoria a largo plazo, con una app web en Vue."
  sceneforge: "Un plugin de IA para el editor de Unity que convierte la descripción de una escena en texto plano en GameObjects y componentes."
  uniconsole: "Una consola de depuración dentro del juego para Unity, gratuita y ligera: marca un método estático con [Command] y llámalo desde un terminal en la escena."
  forkcast: "Un proyecto escolar de planificación de comidas con búsqueda de recetas mediante la API de Spoonacular, un calendario de comidas y listas de la compra combinadas. Lukas escribió la mayor parte del backend en TypeScript."
  space_defenders: "Un juego arcade para móvil hecho en Unity, con oleadas crecientes de naves enemigas y controles táctiles."
  pigeon: "Un juego satírico de Unity en desarrollo sobre una paloma que realiza operaciones encubiertas para el gobierno."
  roboducks: "Trabajo para la competición de robótica RescueMaze en el club de robótica de la HTL Leonding: un protocolo serie entre una Raspberry Pi y un hub LEGO SPIKE, y un controlador de exploración de laberintos con el algoritmo de Trémaux."

