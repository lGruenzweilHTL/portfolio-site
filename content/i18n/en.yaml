vg:
  model: "Chassis · hot-swap"
  status: Active
  view_label: Chassis view
  front: Front
  rear: Rear
  lead: "A self-hosted voice assistant, built as a distributed system: edge relays capture speech, a central orchestrator runs the model pipeline, and a phone app approves anything risky."
  role: "Architect & primary developer"
  project_page: Project page
  org: Org on GitHub
  org_sr: "(vektorgrid organization, opens in a new tab)"
  repo_sr: 'repository on GitHub, opens in a new tab'
  modules_label: vektorgrid components
  origin_role: Orchestrator
  origin_desc: "Everything routes through Origin; no two nodes talk directly. It drives the pipeline and collects each result."
  relay_role: Edge wake-word
  relay_desc: "Catches the wake-word at the edge and streams audio to Origin. The spoken reply comes back the same way."
  gate_role: Biometric approval
  gate_desc: "Risky tool calls pause until they're approved with biometrics on the phone. Also works as a standalone relay."
  scalars_role: Model pipeline
  scalars_desc: "Speech-to-text, intent router, expert LLM and text-to-speech, called in sequence by Origin."
  pull: Pull
  rear_cap: "Rear view · wiring"
  steps_label: Step through the request pipeline
  step1: Capture
  step3: Route
  step4: Inference
  step5: Approve
  step7: Reply
  diagram_title: "vektorgrid architecture: Relay and Gate connect through a central Origin orchestrator, which drives a sequential Scalar pipeline of STT, intent router, expert LLM, and TTS."
  d_audio: audio
  d_speech: speech
  d_approval: tool approval
  d_orchestrator: orchestrator
  d_wake: wake-word
  d_biometric: biometric
  d_in_sequence: in sequence
  d_router: Intent router
  d_llm: Expert LLM
  flow_html: >-
    Everything routes through <b>Origin</b>; no two nodes talk directly. A <b>Relay</b>
    catches the wake-word and streams audio to Origin, which drives the <b>Scalar</b>
    pipeline in order (STT &#8594; intent router &#8594; expert LLM &#8594; TTS), calling each
    worker and collecting its result before the next. The spoken reply returns through the
    Relay. If the model requests a risky tool call, Origin pauses and asks <b>Gate</b> to
    approve it with biometrics. Gate also runs standalone: it polls Origin for metrics and has
    a Relay built in, so you can talk to the system from your phone.

