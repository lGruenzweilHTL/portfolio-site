vk:
  lead: "Marshal's predecessor: a self-hosted voice assistant built as a distributed system. I wanted my own Jarvis, and a reason to use four programming languages in one project."
  h1: "A C# orchestrator that every call goes through, with wake-word relays in C++ at the edge."
  h2: "A Python pipeline from speech to text, through an intent router and a language model, back to speech."
  h3: "Risky tool calls waited for biometric approval in a Kotlin app on my phone."
  learned_title: "What I learned"
  learned: "Don't hand-write the speech pipeline and the satellite protocol. They took most of the time and weren't the interesting part. Marshal leaves voice to Home Assistant Assist and puts the effort into the agent."

