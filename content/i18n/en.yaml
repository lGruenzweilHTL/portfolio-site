mg:
  lead: "A self-hosted AI agent for Home Assistant. It runs the 3D printer, sorts mail, prepares the morning and remembers what matters. Harmless actions just happen; risky ones wait for a clear yes."
  role: "Author, since September 2026"
  h1: "An ASP.NET harness every request goes through: agent loop, tool registry, model router, MCP client."
  h2: "A risk engine tiers every tool call. Safe calls run, confirm waits with its exact arguments frozen until I approve, forbidden never runs."
  h3: "Durable background tasks and a long-term memory with hybrid retrieval on SQLite and sqlite-vec, with a Vue web app on top."
  project_page: "Project page"
  docs: "Docs"
  docs_sr: "Marshal documentation, opens in a new tab"
  repo: "Repository"
  repo_sr: "Marshal on GitHub, opens in a new tab"
  shot_alt: "Marshal dashboard with pending approvals to unlock the front door and start a print, next to a live 3D printer status card"
  note: "risky ones wait for a clear yes"

gate:
  title: "The risk gate."
  caption_html: "Every tool call gets a risk tier. Safe calls run at once. Confirm calls, for example <code>printer.start_print</code>, are held with their exact arguments frozen for up to 60&nbsp;s until I say yes. Forbidden calls never run."
  aria: "Diagram: a tool call gets a risk tier. Safe calls run at once; confirm calls are held with their arguments frozen for up to 60 seconds until I say yes; forbidden calls never run."
  call: "a tool call"
  tier: "risk tier"
  every: "every call gets one"
