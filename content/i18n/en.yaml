  now: "runs at once"
  confirm: "confirm"
  example: "e.g. printer.start_print"
  held: "held"
  frozen: "exact arguments frozen"
  ttl: "up to 60 s"
  say_yes: "I say yes"
  runs: "runs"
  forbidden: "forbidden"
  never: "never runs"

