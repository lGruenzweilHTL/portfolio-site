about:
  title: About
  p1: "I'm Lukas, a student at HTL Leonding. Most of my time goes into server code and games, and every so often into a Raspberry Pi bolted to a LEGO robot for a competition."
  p2_html: "Most of my projects started because something annoyed me. I built <strong>SceneForge AI</strong> because setting up scenes by hand is tedious, and a serial protocol for the robotics club because there was no clean way to drive a LEGO SPIKE from a Raspberry Pi."
  p3: "Away from the keyboard: table tennis, motorbikes, and more Trackmania than I'd like to admit."
  homelab: "Homelab"
  homelab_desc: "Four Proxmox nodes (repurposed desktops) hosting Immich, Gitea, Vaultwarden, Jellyfin with the *arr stack, a Minecraft server, Pi-hole, and this site. My family relies on it, so it has backups and replicated storage."
  ender: "Ender of Theseus"
  ender_desc_html: 'An Ender 3 Pro. It has been modded enough that I named it after the <a href="https://en.wikipedia.org/wiki/Ship_of_Theseus" target="_blank" rel="noopener">Ship of Theseus<span class="sr-only"> (Wikipedia, opens in a new tab)</span></a>. Next on the list: an enclosure for the board, remote power and a dual Z screw.'
  moto: "Motorbikes"
  moto_desc: "Currently an Aprilia Tuono 125, with plans to move up to something bigger."
  sketch_alt: "Chalk sketch of my Ender 3 Pro 3D printer"
  next: "next on the list:"
  n_z: "a dual Z screw"
  n_power: "remote power"
  n_board: "an enclosure for the board"

