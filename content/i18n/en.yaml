# key falls back to this file. Keys ending in _html are trusted markup, the
# rest is escaped. {name}-style placeholders are filled by the template.
# See backend/i18n.py. Facts must match content/resume.yaml, the JSON-LD in
# backend/templates/index.html and site/llms.txt.

