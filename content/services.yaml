# Public directory for self-hosted services.
categories:
  - id: portfolio
    name: Portfolio
    description: This site and its admin dashboard.
    visibility: public
    urls:
      - label: Main site
        url: https://gruenzweil.cc
      - label: Admin
        url: https://gruenzweil.cc/admin

  - id: identity
    name: Identity and access
    description: One login for everything below that has one.
    visibility: public
    urls:
      - label: Authentik
        url: https://auth.gruenzweil.cc

  - id: cloud-communication
    name: Cloud and communication
    description: Nextcloud for files, ntfy for push notifications, FreshRSS for feeds.
    visibility: public
    urls:
      - label: Nextcloud
        url: https://cloud.gruenzweil.cc
      - label: Ntfy
        url: https://ntfy.gruenzweil.cc
    services:
      - id: freshrss
        name: FreshRSS
        description: Where I read my feeds.
        visibility: internal
        urls:
          - label: Open FreshRSS
            url: https://freshrss.internal.gruenzweil.cc

  - id: gaming
    name: Gaming
    description: Panel for the Minecraft server.
    visibility: public
    urls:
      - label: Discopanel
        url: https://discopanel.gruenzweil.cc

  - id: home-family
    name: Home and family
    description: Home Assistant, plus apps the family uses.
    visibility: public
    urls:
      - label: Home Assistant
        url: https://hass.gruenzweil.cc
      - label: Sprachlaute
        url: https://sprachlaute.gruenzweil.cc

  - id: media
    name: Media
    description: Jellyfin, and the *arr stack that keeps it stocked.
    visibility: public
    services:
      - id: jellyfin
        name: Jellyfin
        description: Reachable from outside the house.
        visibility: public
        urls:
          - label: Open Jellyfin
            url: https://media.gruenzweil.cc

      - id: media-automation
        name: Automation and downloads
        description: Sonarr, Radarr and the two download clients behind them.
        visibility: internal
        urls:
          - label: Sonarr
            url: https://sonarr.internal.gruenzweil.cc
          - label: Radarr
            url: https://radarr.internal.gruenzweil.cc
          - label: qBittorrent
            url: https://qbittorrent.internal.gruenzweil.cc
          - label: SABnzbd
            url: https://sabnzbd.internal.gruenzweil.cc

  - id: network-infrastructure
    name: Network and infrastructure
    description: Two Pi-holes, the reverse proxy and the three Proxmox nodes.
    visibility: internal
    urls:
      - label: Pi-hole 1
        url: https://dns.internal.gruenzweil.cc
      - label: Pi-hole 2
        url: https://dns2.internal.gruenzweil.cc
      - label: Nginx Proxy Manager
        url: https://proxy.internal.gruenzweil.cc
      - label: Proxmox 1
        url: https://pve1.internal.gruenzweil.cc
      - label: Proxmox 2
        url: https://pve2.internal.gruenzweil.cc
      - label: Proxmox 3
        url: https://pve3.internal.gruenzweil.cc

  - id: security
    name: Security
    description: API keys and passwords for the services above.
    visibility: internal
    urls:
      - label: Infisical
        url: https://secrets.internal.gruenzweil.cc

  - id: monitoring
    name: Monitoring
    description: Uptime Kuma checks everything and pings me when something goes down.
    visibility: internal
    urls:
      - label: Uptime Kuma
        url: https://uptime.internal.gruenzweil.cc
