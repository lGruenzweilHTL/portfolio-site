# Single source of truth for the portfolio site.
# Consumed by:
#   - backend/resume.py  -> resume PDF (WeasyPrint render)
#   - backend/chat.py    -> chatbot system prompt
# Validate with: backend/content.py::load_content (raises on schema errors)
#
# Keep this in sync with the main page for the project list
# (backend/templates/index.html + content/i18n/*.yaml). The site has the rich
# narrative; this file has the structured facts.

personal:
  name: "Lukas Grünzweil"
  title: "Student · Backend, AI, Game dev"
  location: "Austria"
  email_personal: "lukas.gruenzweil@liwest.at"
  email_school: "l.gruenzweil@students.htl-leonding.ac.at"
  github: "lGruenzweilHTL"
  github_url: "https://github.com/lGruenzweilHTL"
  github_org_url: "https://github.com/vektorgrid-ai"  # the vektorgrid org
  status: "Student, HTL Leonding"
  # Shown under the name on both résumé PDFs and as the hero line on the site.
  # A short availability statement reads better than an empty slot here.
  availability: "4/5 at HTL Leonding · graduating June 2028 · open to a backend internship"
  # Relative to backend/templates/, drawn as a circle. Swap in a real portrait
  # (assets/photo.jpg) when you have one.
  photo: "assets/placeholder.webp"
  # Optional — both résumé templates render fine without these; they simply
  # leave the slot out. Uncomment when you have them.
  # phone: "+43 ..."
  # linkedin: "lukas-gruenzweil"
  # linkedin_url: "https://linkedin.com/in/lukas-gruenzweil"
  website: "https://gruenzweil.cc"

education:
  - school: "HTL Leonding"
    location: "Leonding, Austria"
    start: 2022-09
    end: 2028-06
    notes: "Higher technical college (Höhere Technische Lehranstalt)"
    # Set date_label instead if you'd rather write the range by hand.
    # Worth adding here if you have them — they carry more signal than
    # another school would:
    # prak_where: "..."

# Professional experience, most-recent first.
# Rendered by both résumé PDFs. The public HTML site has its own richer copy
# on the main page (content/i18n/*.yaml); public_summary and public_tags below are the reference
# for it, kept here so the facts have one home, but nothing reads them.
#
# Keep `summary` to one line of context the bullets can't carry (team, scope,
# duration) — bullets are the part people actually read. Prose that repeats the
# bullets is the main reason a résumé gets skimmed.
#
# Dates: start/end take "2026-08" (rendered "08 / 2026") or a bare year.
# Leave end empty, or set it to "present", for a current role. Set
# date_label to override the formatted range entirely — do that for a
# single-month role, or the range prints the same month twice.
experience:
  - org: "SlideLizard Software GmbH"
    role: "Software Engineering Intern"
    location: "Linz, Austria"
    date_label: "08 / 2026"
    start: 2026-08
    end: 2026-08
    summary: >
      One-month internship on a small product team shipping a customer-facing PWA.
    highlights:
      - "Angular PWA on Microsoft Dynamics 365 Sales: Azure Speech meeting notes plus an Azure OpenAI assistant wired to Dataverse"
      - "Called Dataverse through the MCP server directly to avoid per-call MCP billing"
      - "Side project: a daily GEO-visibility tracker over OpenRouter for a fixed prompt set"
      - "Head of development called it one of the best projects to come out of an internship there"
    public_summary: >
      Built a PWA on top of Dynamics 365 Sales with speech-to-text meeting
      notes and an Azure OpenAI assistant wired into Dataverse, plus a
      small daily GEO-visibility tracker on the side. The head of
      development called it one of the best projects to come out of an
      internship there.
    public_tags: ["Angular", "TypeScript", "Azure Speech", "Azure OpenAI", "Dataverse", "OpenRouter"]

  - org: "Caritas Upper Austria"
    role: "Office & IT Assistant Intern"
    location: "Leonding, Austria"
    start: 2025-07
    end: 2025-08
    summary: >
      Two-month internship in office administration and IT support.
    highlights:
      - "Administrative support and accounting assistance, including quarterly billing (Quartalsabrechnung)"
      - "First-level IT support and infrastructure tasks"
    public_summary: >
      Office and IT support: admin, accounting assistance, first-level IT.
    public_tags: ["Admin", "IT support", "Billing"]

# All projects, for the site and the chatbot. Only the ones marked `cv: true`
# appear on the résumé PDFs — those are picked to support the backend angle, and
# the résumé has room for two. Add the flag to a project to promote it.
projects:
  - name: "vektorgrid"
    cv: true
    summary: >
      A self-hosted voice assistant built as a distributed system: edge relays capture
      speech, a central orchestrator runs the model pipeline, and a phone app approves
      anything risky.
    role: "Architect & primary developer"
    stack: ["C#", "C++", "Kotlin", "Python"]
    repo_url: "https://github.com/vektorgrid-ai"
    status: "active"   # active | shipped | in_progress | private
    highlights:
      - "Origin orchestrator in C#, edge relays in C++ (wake-word), biometric approval app in Kotlin"
      - "Python pipeline chains STT → intent router → expert LLM → TTS; every call routes through Origin, never peer-to-peer"
      - "Risky tool calls pause for biometric approval on the phone before execution"

  - name: "SceneForge AI"
    cv: true
    summary: >
      An AI plugin for the Unity Editor. Describe a scene in plain text, get
      GameObjects and components back. Cuts the manual setup out of level design.
    role: "Author"
    stack: ["C#", "Unity"]
    repo_url: "https://github.com/lGruenzweilHTL/SceneForge-AI"
    status: "shipped"

  - name: "UniConsole"
    summary: >
      An in-game debug console for Unity. Mark a static method with [Command] and
      call it from a terminal in the scene. A free, lightweight alternative to
      Quantum Console.
    role: "Author"
    stack: ["C#", "Unity"]
    repo_url: "https://github.com/lGruenzweilHTL/UniConsole"
    status: "shipped"

  - name: "P.I.G.E.O.N. — Covert Ops"
    summary: >
      You play a pigeon on the government payroll, running covert ops. A satire
      built around surveillance paranoia and the "birds aren't real" corner of the
      internet.
    role: "Author"
    stack: ["C#", "Unity"]
    repo_url: null  # TODO: swap for a GitHub link once the repo is public
    status: "in_progress"

  - name: "Forkcast"
    summary: >
      A meal-planning app. Find recipes through the Spoonacular API, drop them
      into a calendar, get a combined ingredient list, rate recipes, add friends.
      Vue frontend, TypeScript backend (most of which I wrote).
    role: "Contributor · TypeScript backend"
    stack: ["TypeScript", "Vue"]
    repo_url: null  # private school project
    status: "private"

  - name: "RoboDucks — RescueMaze"
    summary: >
      RescueMaze competition work for the HTL Leonding robotics club. Built a
      custom serial protocol for Raspberry Pi → LEGO SPIKE communication, and a
      maze-exploration controller running Trémaux's algorithm in simulation.
    role: "Contributor · HTL Leonding robotics club"
    stack: ["Python", "C"]
    repo_url: "https://github.com/lGruenzweilHTL/lego-spike-serial"
    status: "shipped"

  - name: "Space Defenders"
    summary: >
      A mobile arcade game: destroy enemy spaceships, don't die. Escalating
      waves, built for touchscreens.
    role: "Author"
    stack: ["C#", "Unity"]
    repo_url: "https://github.com/lGruenzweilHTL/Space-Defenders"
    status: "shipped"

skills:
  # Flat lists, ordered most-relevant-first for a backend role. The old
  # strong/familiar split is gone: it invited "define familiar", which is a bad
  # interview position, and a plain list is easier to defend.
  languages: ["C#", "Python", "TypeScript", "C", "C++", "Kotlin", "Java", "HTML/CSS"]
  tools_and_infra:
    - "Docker"
    - "Kubernetes"
    - "Azure"
    - "Unity"
    - "Docker Compose"
    - "Proxmox"

  # Spoken languages, for Austrian applications where a "Sprachen" block is
  # expected and genuinely gets filtered on. Check the levels before sending.
  spoken:
    - language: "German"
      level: "Native"
    - language: "English"
      level: "Professional working proficiency"

  # devicon class name(s) per skill, used only by the styled resume template
  # (backend/templates/resume.html). A value may list several classes to render
  # more than one glyph for one label, e.g. "HTML/CSS" -> "html5 css3".
  # Names without a devicon class render a neutral dot instead of an icon.
  # The font is subset to exactly these glyphs — after editing this map, re-run
  #   python scripts/build_devicon_subset.py
  icons:
    "C#": csharp
    "Python": python
    "TypeScript": typescript
    "C": c
    "C++": cplusplus
    "Java": java
    "Kotlin": kotlin
    "HTML/CSS": html5 css3
    "Unity": unity
    "Docker": docker
    "Docker Compose": docker
    "Kubernetes": kubernetes
    "Azure": azure
    "Proxmox": proxmox

# Beyond-code is personal context for the chatbot. The site displays this
# in the About section; the chatbot uses it to answer "what do you do outside code?"
beyond_code:
  - topic: "Homelab"
    body: >
      Three Proxmox nodes (repurposed desktops, with a fourth on the way) hosting
      Nextcloud, Vaultwarden, Jellyfin with the *arr stack, a Minecraft server,
      Pi-hole, and this site, all reachable from outside my network.
  - topic: "3D printing"
    body: >
      I 3D print functional parts for hardware projects and keep upgrading an
      Ender 3 Pro. It runs Klipper off a Raspberry Pi and has been modded enough
      that I call it the "Ender of Theseus."
  - topic: "Motorbikes"
    body: >
      Currently on an Aprilia Tuono 125, with plans to move up to something bigger.

# Background only the chatbot knows: things recruiters ask that the site has no
# room for. Optional; nothing else reads it. Anything here can be coaxed out of
# the bot, so treat it as published.
chat_only:
  - topic: "What I'm looking for"
    body: >
      Backend work by preference, full stack when a project needs it. C# is my
      favourite, but I'm comfortable in every language my projects use. No
      preference on team size yet; I'm still finding out what suits me. I can
      work in and around Linz or fully remote, but I can't relocate. After
      graduating in 2028 I plan to start working rather than go to university.
  - topic: "Why I built vektorgrid"
    body: >
      I'm an Iron Man fan and wanted my own Jarvis. It was also a deliberate
      chance to learn several languages in one system (C#, Python, C++,
      Kotlin). Biggest lesson: I wouldn't write the audio processing and the
      satellite protocol myself again. A successor is in development and not
      public yet; the one detail I share is that it builds on Home Assistant
      Assist with a custom integration instead.
  - topic: "SceneForge AI and UniConsole, honestly"
    body: >
      Both started because I needed them for my own projects. They're small and
      early, and nobody really uses them yet. Looking back the code quality
      isn't great, which mostly shows how much I've learned since.
  - topic: "My part in RoboDucks"
    body: >
      The team is mostly classmates. My part was the serial protocol between
      the Raspberry Pi and the LEGO Spike. The team hasn't competed yet; this
      school year a friend and I lead it, and we plan to enter a competition in
      April 2027.
  - topic: "What SlideLizard taught me"
    body: >
      Far more solving problems on my own than school asks for. I developed
      mostly with AI there, so I learned a lot about prompting and steering AI
      coding tools.
  - topic: "A homelab outage I fixed from school"
    body: >
      My brother texted me that the internet was down while I was at school.
      Several important services were down, Pi-hole among them, but WireGuard
      was still up, so I connected remotely and had it fixed in about an hour.
      The cause was a stalled drive operation that left the drive unusable and
      took every service on it down.
  - topic: "How I work in a team"
    body: >
      I don't have enough team experience to name a preference; it depends on
      the people. I try to fill the gaps: depending on what my teammates are
      best at, I take the lead or do most of the coding. I care about developer
      experience: a teammate should get what a tool does in the first ten
      seconds.
  - topic: "How I learn"
    body: >
      Videos, or I let AI build sample projects that I read and play with, then
      I build my own thing.
  - topic: "What I enjoy"
    body: >
      Exploring interesting new features. The parts I like least are bug hunts
      and writing docs.
  - topic: "School"
    body: >
      I'm in the Informatik department at HTL Leonding. My favourite subjects
      are AI and data science, and network technologies.
  - topic: "How I got into programming"
    body: >
      At 12 or 13, through game dev: a friend recommended Brackeys' Unity
      tutorials, back when he still made Unity videos.
  - topic: "Other hobbies"
    body: >
      Table tennis, a lot of Trackmania, and I like Chinese food.

# Recruiter-facing summary. Used by the chatbot's "tell me about yourself"
# answer and the site — NOT the résumé PDFs, which open straight into education
# and experience. Keep it first-person and specific.
elevator_pitch: >
  I'm a student in Austria. Most of my work is backend systems and AI tooling,
  with games and occasional robotics on the side. I built vektorgrid, a
  self-hosted voice assistant as a distributed system; SceneForge AI, a Unity
  Editor plugin that builds scenes from text; and UniConsole, a free in-game
  debug console for Unity. When something annoys me enough, I write code for it.
