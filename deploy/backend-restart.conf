# Recreate the deploy restart *directory* on every boot, with permissions
# the app process (www-data by default) can write to.
#
# This is a DIRECTORY, not a file, and that matters. The deploy handler
# (www-data) creates the trigger file inside it; a .path unit reacts to the
# file *appearing*. A pre-created trigger file cannot work:
#
#   - At boot the file already exists, so PathExists= fires immediately and
#     burns the one trigger on a pointless restart, before any deploy.
#   - backend-restart.service deletes the trigger in ExecStartPre=, and /run
#     is root-owned 0755, so the next deploy's touch() gets EACCES and can
#     never re-create it.
#
# A group-writable directory fixes both: the app can always create the
# trigger, and each deploy produces a real "file appeared" edge.
#
# Mode 0770 lets the www-data group create entries; only root (the watcher
# service) deletes them.
#
# Adjust the group to match the User= declared in backend.service.
# Install: sudo cp deploy/backend-restart.conf /etc/tmpfiles.d/backend-restart.conf

d /run/backend-restart 0770 root www-data -
