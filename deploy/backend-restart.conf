# Recreate the deploy restart flag on every boot with permissions the
# app process (www-data by default) can write to.
#
# `f` = create the file if missing, type "regular file".
# Mode 0664 + group=www-data lets the deploy webhook (running as
# www-data) call Path.touch() without EACCES. The path unit's
# ExecStartPre=/bin/rm -f removes the file on every restart, and
# systemd-tmpfiles re-creates it on the next boot. For a
# restart-during-runtime deploy this is a no-op (file still exists
# from the touch() in deploy.py).
#
# Adjust `Group=` to match the User= declared in backend.service.
# Install: sudo cp deploy/backend-restart.conf /etc/tmpfiles.d/backend-restart.conf

f /run/backend.restart 0664 root www-data -
