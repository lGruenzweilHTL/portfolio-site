<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ code }} {{ title }} — Lukas Grünzweil</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0e11">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Sans:wght@400&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<!-- An error is an empty slot in the rack: the same unit anatomy as the main
     page (site/styles.css), inlined so this page never depends on it. -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --rack-powder: #0d0e11; --rack-hole: #030304; --face-anodized: #2a2d33; --face-raised: #33373f;
    --face-edge: #15171b; --panel-line: #262930; --text-hi: #f1f2f4; --text-body: #c8ccd3;
    --silk-label: #d9dce1; --silk-dim: #9096a1; --accent-key: #62e3d6; --accent-on: #17110a;
    --led-red: #ff5c5c; --lcd-bg: #03181b; --lcd-text: #7ff6ea;
    --metal: linear-gradient(180deg, rgb(255 255 255 / .10), rgb(255 255 255 / .02) 50%, rgb(0 0 0 / .30));
    --bevel: inset 0 2px 0 rgb(255 255 255 / .22), inset 2px 0 0 rgb(255 255 255 / .08), inset 0 -3px 0 rgb(0 0 0 / .6), inset -2px 0 0 rgb(0 0 0 / .45), inset 0 0 0 1px rgb(0 0 0 / .85);
    --recess: inset 0 3px 8px rgb(0 0 0 / .75), inset 0 1px 0 rgb(0 0 0 / .9), 0 1px 0 rgb(255 255 255 / .06);
    --button: 0 3px 0 #050607, 0 6px 10px rgb(0 0 0 / .45), inset 0 1px 0 rgb(255 255 255 / .25);
  }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: radial-gradient(ellipse 80% 50% at 50% 0%, rgb(42 46 54 / .5), transparent 70%), var(--rack-powder);
    color: var(--text-body); font: 16px/1.6 'IBM Plex Sans', system-ui, sans-serif;
  }
  .unit {
    width: min(760px, 100%); display: grid; grid-template-columns: 40px minmax(0, 1fr) 40px;
    box-shadow: 0 5px 0 var(--rack-hole), 0 22px 34px rgb(0 0 0 / .7);
  }
  .ear {
    background:
      radial-gradient(circle at 50% 22px, #c9cdd3 0 1.2px, #8a9099 1.8px 4px, #3b3f47 4.6px 5px, transparent 5.5px),
      radial-gradient(8px 13px at 50% 22px, var(--rack-hole) 0 92%, transparent 100%),
      radial-gradient(circle at 50% calc(100% - 22px), #c9cdd3 0 1.2px, #8a9099 1.8px 4px, #3b3f47 4.6px 5px, transparent 5.5px),
      radial-gradient(8px 13px at 50% calc(100% - 22px), var(--rack-hole) 0 92%, transparent 100%),
      linear-gradient(90deg, rgb(255 255 255 / .1), rgb(0 0 0 / .1) 78%, rgb(0 0 0 / .45) 90%, rgb(0 0 0 / .2)),
      var(--face-anodized);
    box-shadow: var(--bevel);
  }
  .face { padding: 14px 32px 28px; background: var(--metal), var(--face-anodized); box-shadow: var(--bevel); min-width: 0; }
  .silk { font: 600 11px/1.3 'IBM Plex Sans Condensed', 'IBM Plex Sans', sans-serif; text-transform: uppercase; letter-spacing: .12em; color: var(--silk-label); }
  .dim { color: var(--silk-dim); }
  .head { display: flex; align-items: center; gap: 12px; padding-bottom: 10px; margin-bottom: 24px; border-bottom: 1px solid var(--panel-line); }
  .led { width: 10px; height: 10px; border-radius: 50%; background: var(--led-red); box-shadow: 0 0 10px 1px rgb(255 92 92 / .8); margin-left: auto; }
  .slot { display: flex; gap: 28px; align-items: center; }
  .vents {
    flex: none; width: 150px; height: 104px; border-radius: 3px; padding: 10px;
    background: repeating-linear-gradient(90deg, var(--face-edge) 0 10px, transparent 10px 16px) content-box, var(--rack-hole);
    box-shadow: var(--recess);
  }
  .code { display: inline-block; margin-bottom: 10px; padding: 2px 8px; border-radius: 2px; background: var(--lcd-bg); color: var(--lcd-text); font: 20px 'Share Tech Mono', monospace; box-shadow: inset 0 0 14px rgb(0 0 0 / .85); text-shadow: 0 0 6px rgb(127 246 234 / .55); }
  h1 { font: 700 26px/1.2 'Bricolage Grotesque', system-ui, sans-serif; color: var(--text-hi); margin-bottom: 8px; }
  p { margin-bottom: 20px; }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; }
  a.key {
    display: inline-flex; align-items: center; padding: 10px 18px; border-radius: 4px; text-decoration: none;
    font: 600 13px/1.2 'IBM Plex Sans Condensed', 'IBM Plex Sans', sans-serif; text-transform: uppercase; letter-spacing: .08em;
    color: var(--silk-label); background: var(--metal), var(--face-raised); border: 1px solid var(--face-edge); box-shadow: var(--button);
  }
  a.key.primary { color: var(--accent-on); background: var(--metal), var(--accent-key); }
  a.key:hover { filter: brightness(1.12); }
  a:focus-visible { outline: 2px solid var(--accent-key); outline-offset: 3px; }
  .path { margin-top: 20px; font: 12px 'Share Tech Mono', monospace; color: var(--silk-dim); word-break: break-all; }
  @media (max-width: 560px) {
    .unit { grid-template-columns: 14px minmax(0, 1fr) 14px; }
    .ear { background: var(--face-anodized); }
    .face { padding: 12px 16px 20px; }
    .vents { display: none; }
  }
</style>
</head>
<body>
<main class="unit">
  <i class="ear" aria-hidden="true"></i>
  <div class="face">
    <div class="head" aria-hidden="true">
      <span class="silk">U-{{ code }}</span><span class="silk dim">Not populated</span><span class="led"></span>
    </div>
    <div class="slot">
      <div class="vents" aria-hidden="true"></div>
      <div>
        <span class="code">{{ code }}</span>
        <h1>{{ title }}</h1>
        <p>{{ message }}{% if code == 404 %} Nothing is mounted in this slot.{% endif %}</p>
        <div class="actions">
          <a class="key primary" href="/">Back to the rack</a>
          <a class="key" href="/notes/">Notes</a>
          <a class="key" href="/files/">Files</a>
        </div>
        {% if path %}<div class="path">{{ path }}</div>{% endif %}
      </div>
    </div>
  </div>
  <i class="ear" aria-hidden="true"></i>
</main>
</body>
</html>
